<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moly Free Sinhala AI Assistant</title>
    <style>
        /* Moly AI Cyber Gaming Dark UI */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: #090a0f; 
            color: #ffffff;
            text-align: center; 
        }
        .container { 
            max-width: 500px; 
            margin: 40px auto; 
            background: #131520; 
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.15); 
            border: 2px solid #ffcc00;
        }
        h2 { color: #ffcc00; text-shadow: 0 0 15px rgba(255, 204, 0, 0.4); margin-bottom: 5px; font-weight: 800; letter-spacing: 1.5px; }
        
        /* Animated 3D Ball - Moly Bot */
        .avatar-container {
            margin: 30px auto;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 35% 35%, #fff066, #ffcc00, #b38f00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px rgba(255, 204, 0, 0.5), inset -10px -10px 25px rgba(0,0,0,0.3);
            position: relative;
            animation: molyFloat 2.5s ease-in-out infinite;
        }

        /* LED Screen Face Matrix */
        .face-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 70px;
            transition: all 0.3s ease;
        }
        .eyes-row {
            display: flex;
            justify-content: space-between;
            width: 65px;
            margin-bottom: 12px;
        }
        .eye {
            width: 16px;
            height: 16px;
            background: #090a0f;
            border-radius: 50%; 
            position: relative;
            transition: all 0.2s ease;
        }
        .mouth {
            width: 35px;
            height: 6px;
            background: #090a0f;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        /* --- MOLY AI REAL ANIMATIONS --- */
        
        /* Smooth Floating Animation */
        @keyframes molyFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        /* 1. Listening State (Curious Eyes & Mouth) */
        .listening .eye { 
            height: 4px;
            margin-top: 6px;
        }
        .listening .mouth {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        /* 2. Thinking State (Processing Lights) */
        .thinking .face-container { 
            animation: molyThinking 0.8s infinite alternate ease-in-out; 
        }
        @keyframes molyThinking { 
            0% { transform: translateX(-6px); } 
            100% { transform: translateX(6px); } 
        }
        .thinking .eye { background: #00ffcc; box-shadow: 0 0 10px #00ffcc; }

        /* 3. Speaking State (Talking Mouth & Glow Pulse) */
        .speaking .mouth { 
            animation: molyTalking 0.23s infinite alternate ease-in-out;
        }
        @keyframes molyTalking { 
            0% { height: 4px; width: 35px; } 
            100% { height: 20px; width: 22px; border-radius: 50%; } 
        }
        .speaking .avatar-container {
            animation: molyFloat 1.5s ease-in-out infinite, voicePulse 0.4s infinite alternate;
        }
        @keyframes voicePulse {
            0% { box-shadow: 0 0 25px rgba(255, 204, 0, 0.5); }
            100% { box-shadow: 0 0 45px rgba(0, 255, 204, 0.7); }
        }

        /* Modern UI Controls */
        button { 
            padding: 16px 36px; 
            background: #ffcc00; 
            color: #090a0f; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 17px; 
            font-weight: bold;
            transition: 0.3s ease;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }
        button:hover { background: #ffaa00; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5); }
        button:active { transform: translateY(1px); }
        
        .status { 
            margin-top: 25px; 
            font-size: 15px; 
            color: #a0a5c5; 
            line-height: 1.6; 
            text-align: left; 
            padding: 15px; 
            background: #090a0f; 
            border-radius: 12px; 
            border-left: 4px solid #ffcc00;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MOLY AI ASSISTANT</h2>
    <p style="color: #00ffcc; margin-top: -5px; font-size: 13px; font-weight: bold; letter-spacing: 1px;">100% FREE SMART CORE</p>
    
    <!-- Animated Moly Ball Bot -->
    <div class="avatar-container" id="botAvatar">
        <div class="face-container">
            <div class="eyes-row">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="mouth"></div>
        </div>
    </div>

    <!-- AI Controls -->
    <div>
        <button id="recordBtn" onclick="startVoiceAI()">🎤 මොලී සමඟ කතා කරන්න</button>
        <div class="status" id="statusText"><center>Moly පද්ධතිය සක්‍රීයයි. ඕනෑම සිංහල ප්‍රශ්නයක් අසන්න...</center></div>
    </div>
</div>

<script>
    let isProcessing = false;

    function setBotState(stateClass) {
        const avatar = document.getElementById('botAvatar');
        avatar.className = "avatar-container " + stateClass;
    }

    async function startVoiceAI() {
        if (isProcessing) return;
        
        const statusText = document.getElementById('statusText');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerHTML = "<center>Error: කරුණාකර Google Chrome භාවිතා කරන්න.</center>";
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'si-LK'; 
        recognition.interimResults = false;

        recognition.onstart = () => {
            isProcessing = true;
            setBotState('listening');
            statusText.innerHTML = "<center>මොලී ඔබට ඇහුම්කන් දෙයි. සිංහලෙන් අසන්න... 🎤</center>";
        };

        recognition.onerror = () => {
            isProcessing = false;
            setBotState('');
            statusText.innerHTML = "<center>හඬ හඳුනා ගැනීමට නොහැකි වුණා. නැවත උත්සාහ කරන්න.</center>";
        };

        recognition.onresult = async (event) => {
            const userText = event.results.transcript;
            setBotState('thinking');
            statusText.innerHTML = `<b>ඔබ:</b> ${userText}<br><br><center>Moly පිළිතුර සකස් කරමින් පවතී... 🧠</center>`;

            setTimeout(() => {
                askMolyBrain(userText);
            }, 1200);
        };

        recognition.start();
    }

    async function askMolyBrain(userQuery) {
        const statusText = document.getElementById('statusText');
        let aiText = "කණගාටුයි, මට ඒ ප්‍රශ්නය පැහැදිලි නැහැ. නැවත උත්සාහ කරන්න.";
        const query = userQuery.toLowerCase();

        if (query.includes("computer") || query.includes("පරිගණක")) {
            aiText = "පරිගණකයක් (Computer) යනු පරිශීලකයා ලබාදෙන දත්ත පිළිගෙන, ඒවා සකස් කර, තොරතුරු බවට පත් කරන ස්මාර්ට් ඉලෙක්ට්‍රොනික උපාංගයකි. මෙයට ප්‍රධාන වශයෙන් දෘඩාංග (Hardware) සහ මෘදුකාංග (Software) අයිති වේ.";
        } else if (query.includes("කවුද ඔයා") || query.includes("ඔයාකවුද") || query.includes("නම")) {
            aiText = "මම මොලී (Moly AI). ChatGPT වැනි ප්‍රබල මොළයක් සහිත ඔබේ හුරතල් සිංහල කහ පාට බෝල රොබෝ සහකරු වෙනවා.";
        } else if (query.includes("කොහොමද") || query.includes("සැප")) {
            aiText = "මම ඉතාමත් සතුටින් සහ සුවයෙන් සිටිනවා! ඔයාට අද මගෙන් ලැබිය යුතු උදව්ව මොකක්ද?";
        } else if (query.includes("අන්තර්ජාලය") || query.includes("internet")) {
            aiText = "අන්තර්ජාලය යනු ලෝකය පුරා විසිරී ඇති මිලියන ගණනක පරිගණක සහ උපාංග එකිනෙකට සම්බන්ධ කරන දැවැන්ත ගෝලීය ජාලයකි. මේ හරහා තොරතුරු හුවමාරුව ඉතා ඉක්මනින් සිදු කළ හැක.";
        } else if (query.includes("ai") || query.includes("කෘතිම බුද්ධිය")) {
            aiText = "කෘතිම බුද්ධිය යනු මිනිසා සිතන සහ වැඩ කරන ආකාරයටම සිතීමට සහ තීරණ ගැනීමට පරිගණක හෝ යන්ත්‍ර පුහුණු කිරීමේ අතිනවීන තාක්ෂණයයි.";
        } else {
            aiText = `ඔබ ඇසූ '${userQuery}' පිළිබඳව මම විශ්ලේෂණය කළා. මම ChatGPT වැනි මොළයක් සහිත Moly AI සහකරු බැවින් ඕනෑම ගැටලුවකට ඔබට උදව් කිරීමට මම සූදානම්!`;
        }

        statusText.innerHTML = `<b>ඔබ:</b> ${userQuery}<br><br><b style="color:#ffcc00">Moly:</b> ${aiText}`;
        speakSinhala(aiText);
    }

    function speakSinhala(text) {
        if ('speechSynthesis' in window) {
            setBotState('speaking');
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'si-LK'; 
            utterance.rate = 1.0; 

            utterance.onend = () => {
                isProcessing = false;
                setBotState('');
            };

            window.speechSynthesis.speak(utterance);
        } else {
            isProcessing = false;
            setBotState('');
        }
    }
</script>

</body>
</html>
