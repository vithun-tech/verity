<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Verity JE Mod Style Sinhala AI</title>
    <style>
        /* Verity Java Edition Mod Dark UI */
        body { 
            font-family: 'Consolas', 'Segoe UI', monospace; 
            padding: 20px; 
            background: #0b0c10; 
            color: #1f2833;
            text-align: center; 
        }
        .container { 
            max-width: 500px; 
            margin: 40px auto; 
            background: #1f2833; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2); 
            border: 2px solid #00ffcc;
        }
        h2 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; margin-bottom: 5px; }
        
        /* Real Verity JE Mod Animated 3D Ball */
        .avatar-container {
            margin: 30px auto;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 35% 35%, #fff066, #ffcc00, #b38f00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px rgba(255, 204, 0, 0.5), inset -10px -10px 25px rgba(0,0,0,0.3);
            position: relative;
            animation: minecraftFloat 2.5s ease-in-out infinite;
        }

        /* LED Display Matrix Face (Like Verity Mod) */
        .face-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 70px;
            transition: all 0.3s ease;
        }
        .eyes-row {
            display: flex;
            justify-content: space-between;
            width: 65px;
            margin-bottom: 12px;
        }
        .eye {
            width: 16px;
            height: 16px;
            background: #0f111a;
            border-radius: 4px; /* Blocky Cyber Look */
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .mouth {
            width: 35px;
            height: 6px;
            background: #0f111a;
            border-radius: 2px;
            transition: all 0.2s ease;
        }

        /* --- VERITY JE MOD REAL ANIMATIONS --- */
        
        /* Minecraft Physics Floating */
        @keyframes minecraftFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* 1. Listening State (Curious Winking Eyes) */
        .listening .eye { 
            height: 4px;
            margin-top: 6px;
            background: #000;
        }
        .listening .mouth {
            width: 15px;
            height: 15px;
            border-radius: 50%;
        }

        /* 2. Thinking State (Matrix LED Scan Animation) */
        .thinking .face-container { 
            animation: modThinking 0.8s infinite alternate ease-in-out; 
        }
        @keyframes modThinking { 
            0% { transform: scale(0.9) translateX(-5px); } 
            100% { transform: scale(1) translateX(5px); } 
        }
        .thinking .eye { background: #00ffcc; box-shadow: 0 0 8px #00ffcc; }

        /* 3. Speaking State (Dynamic Wave Talking Mouth) */
        .speaking .mouth { 
            animation: modTalking 0.2s infinite alternate ease-in-out;
            background: #0f111a;
        }
        @keyframes modTalking { 
            0% { height: 4px; width: 35px; border-radius: 2px; } 
            100% { height: 22px; width: 25px; border-radius: 8px; } 
        }
        .speaking .avatar-container {
            animation: minecraftFloat 1.5s ease-in-out infinite, voicePulse 0.4s infinite alternate;
        }
        @keyframes voicePulse {
            0% { box-shadow: 0 0 25px rgba(255, 204, 0, 0.5); }
            100% { box-shadow: 0 0 45px rgba(0, 255, 204, 0.8); }
        }

        /* Controls */
        button { 
            padding: 15px 35px; 
            background: #00ffcc; 
            color: #0b0c10; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            font-family: 'Consolas', monospace;
            transition: 0.2s;
            margin-top: 20px;
            box-shadow: 0 4px 0px #00b399;
        }
        button:hover { background: #66ffec; transform: translateY(-2px); box-shadow: 0 6px 0px #00b399; }
        button:active { transform: translateY(4px); box-shadow: none; }
        
        .status { 
            margin-top: 25px; 
            font-size: 14px; 
            color: #c5c6c7; 
            line-height: 1.6; 
            text-align: left; 
            padding: 15px; 
            background: #0b0c10; 
            border-radius: 4px; 
            border-left: 4px solid #00ffcc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>VERITY AI MOD v1.5</h2>
    <p style="color: #ffcc00; margin-top: -5px; font-size: 12px; letter-spacing: 2px;">JAVA EDITION STYLE</p>
    
    <!-- Animated Real Verity Ball Bot -->
    <div class="avatar-container" id="botAvatar">
        <div class="face-container">
            <div class="eyes-row">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="mouth"></div>
        </div>
    </div>

    <!-- AI Controls -->
    <div>
        <button id="recordBtn" onclick="startVoiceAI()">[ TALK TO VERITY ]</button>
        <div class="status" id="statusText"><center>> Verity system online. Ready for user voice prompt...</center></div>
    </div>
</div>

<script>
    let isProcessing = false;

    function setBotState(stateClass) {
        const avatar = document.getElementById('botAvatar');
        avatar.className = "avatar-container " + stateClass;
    }

    async function startVoiceAI() {
        if (isProcessing) return;
        
        const statusText = document.getElementById('statusText');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerHTML = "<center>> Error: Chrome browser required for matrix sync.</center>";
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'si-LK'; 
        recognition.interimResults = false;

        recognition.onstart = () => {
            isProcessing = true;
            setBotState('listening');
            statusText.innerHTML = "<center>> Verity is listening. Speak in Sinhala now... 🎤</center>";
        };

        recognition.onerror = () => {
            isProcessing = false;
            setBotState('');
            statusText.innerHTML = "<center>> Error: Audio input package dropped. Retry.</center>";
        };

        recognition.onresult = async (event) => {
            const userText = event.results.transcript;
            setBotState('thinking');
            statusText.innerHTML = `<b>[USER]:</b> ${userText}<br><br><center>> Verity core compiling response... 🧠</center>`;

            setTimeout(() => {
                askChatGPTBrain(userText);
            }, 1200);
        };

        recognition.start();
    }

    async function askChatGPTBrain(userQuery) {
        const statusText = document.getElementById('statusText');
        let aiText = "කණගාටුයි, මට ඒ ප්‍රශ්නය පැහැදිලි නැහැ. නැවත උත්සාහ කරන්න.";
        const query = userQuery.toLowerCase();

        if (query.includes("computer") || query.includes("පරිගණක")) {
            aiText = "පරිගණකයක් (Computer) යනු පරිශීලකයා ලබාදෙන දත්ත පිළිගෙන, ඒවා සකස් කර, තොරතුරු බවට පත් කරන ස්මාර්ට් ඉලෙක්ට්‍රොනික උපාංගයකි. මෙයට ප්‍රධාන වශයෙන් දෘඩාංග (Hardware) සහ मෘදුකාංග (Software) අයිති වේ.";
        } else if (query.includes("කවුද ඔයා") || query.includes("ඔයා කවුද") || query.includes("නම")) {
            aiText = "මම Verity AI, ChatGPT වැනි ප්‍රබල මොළයක් සහිත ඔබේ හුරතල් සිංහල කහ පාට බෝල රොබෝ සහකරු වෙනවා.";
        } else if (query.includes("කොහොමද") || query.includes("සැප")) {
            aiText = "මම ඉතාමත් සතුටින් සහ හොඳින් සිටිනවා! ඔයාට අද උදව් කරන්නේ කොහොමද?";
        } else if (query.includes("අන්තර්ජාලය") || query.includes("internet")) {
            aiText = "අන්තර්ජාලය යනු ලෝකය පුරා විසිරී ඇති මිලියන ගණනක පරිගණක සහ උපාංග එකිනෙකට සම්බන්ධ කරන දැවැන්ත ගෝලීය ජාලයකි. මේ හරහා තොරතුරු හුවමාරුව ඉතා ඉක්මනින් සිදු කළ හැක.";
        } else if (query.includes("ai") || query.includes("කෘතිම බුද්ධිය")) {
            aiText = "කෘතිම බුද්ධිය යනු මිනිසා සිතන සහ වැඩ කරන ආකාරයටම සිතීමට සහ තීරණ ගැනීමට පරිගණක හෝ යන්ත්‍ර පුහුණු කිරීමේ අතිනවීන තාක්ෂණයයි.";
        } else {
            aiText = `ඔබ ඇසූ '${userQuery}' පිළිබඳව මම විශ්ලේෂණය කළා. මම ChatGPT වැනි මොළයක් සහිත Verity AI සහකරු බැවින් ඕනෑම තාක්ෂණික ගැටලුවකට ඔබට උදව් කිරීමට මම සූදානම්!`;
        }

        statusText.innerHTML = `<b>[USER]:</b> ${userQuery}<br><br><b style="color:#00ffcc">[VERITY]:</b> ${aiText}`;
        speakSinhala(aiText);
    }

    function speakSinhala(text) {
        if ('speechSynthesis' in window) {
            setBotState('speaking');
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'si-LK'; 
            utterance.rate = 1.0; 

            utterance.onend = () => {
                isProcessing = false;
                setBotState('');
            };

            window.speechSynthesis.speak(utterance);
        } else {
            isProcessing = false;
            setBotState('');
        }
    }
</script>

</body>
</html>
