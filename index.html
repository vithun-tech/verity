<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity Style Free Sinhala AI</title>
    <style>
        /* Gaming Dark Theme Styling */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: #0f111a; 
            color: #ffffff;
            text-align: center; 
        }
        .container { 
            max-width: 500px; 
            margin: 40px auto; 
            background: #1a1d2e; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
            border: 2px solid #ffcc00;
        }
        
        /* Animated Cute Yellow Ball Emoji Bot */
        .avatar-container {
            margin: 30px auto;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #ffee55, #ffcc00, #cc9900);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.6), inset -10px -10px 20px rgba(0,0,0,0.2);
            position: relative;
            animation: floatBall 3s ease-in-out infinite;
        }

        /* 3D Ball Face Details */
        .face-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 60px;
            position: relative;
            margin-top: 10px;
        }
        .eyes-row {
            display: flex;
            justify-content: space-between;
            width: 65px;
            margin-bottom: 8px;
        }
        .eye {
            width: 16px;
            height: 16px;
            background: #111111;
            border-radius: 50%;
            position: relative;
            transition: all 0.2s;
        }
        .eye::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 3px;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
        }
        .mouth {
            width: 24px;
            height: 12px;
            border-bottom: 4px solid #111111;
            border-radius: 0 0 12px 12px;
            transition: all 0.2s;
        }

        /* Ball Bot Animation States */
        @keyframes floatBall {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        /* Animations */
        .listening .eye { animation: blinkEyes 0.6s infinite alternate; }
        @keyframes blinkEyes { 0% { transform: scaleY(1); } 100% { transform: scaleY(0.1); } }

        .thinking .face-container { animation: thinkLook 1.2s infinite ease-in-out; }
        @keyframes thinkLook { 0% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 100% { transform: translateX(-6px); } }

        .speaking .mouth { 
            animation: speakBallMouth 0.25s infinite alternate; 
            background: #111111;
            height: 16px;
            border-radius: 50%;
            width: 18px;
        }
        @keyframes speakBallMouth { 0% { transform: scaleY(0.6); } 100% { transform: scaleY(1.4); } }

        button { 
            padding: 15px 30px; 
            background: #ffcc00; 
            color: #000; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold;
            transition: 0.3s;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
        }
        button:hover { background: #ffaa00; transform: scale(1.05); }
        .status { margin-top: 25px; font-size: 16px; color: #a0a5c5; line-height: 1.5; min-height: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h2>VERITY AI ASSISTANT 🇱🇰</h2>
    <p style="color: #6c7293; margin-top: -10px; font-size: 14px;">100% Free & Stable (No Keys)</p>
    
    <!-- Animated Yellow Ball Emoji Bot -->
    <div class="avatar-container" id="botAvatar">
        <div class="face-container">
            <div class="eyes-row">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="mouth"></div>
        </div>
    </div>

    <!-- AI Controls -->
    <div>
        <button id="recordBtn" onclick="startVoiceAI()">🎤 කතා කරන්න (Start)</button>
        <div class="status" id="statusText">Verity බෝල රොබෝ සූදානම්. කතා කිරීමට බොත්තම ඔබන්න...</div>
    </div>
</div>

<script>
    let isProcessing = false;

    function setBotState(stateClass) {
        const avatar = document.getElementById('botAvatar');
        avatar.className = "avatar-container " + stateClass;
    }

    async function startVoiceAI() {
        if (isProcessing) return;
        
        const statusText = document.getElementById('statusText');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "කණගාටුයි, ඔබේ බ්‍රවුසරය සිංහල හඬ හඳුනා ගැනීමට සහය දක්වන්නේ නැත. Google Chrome භාවිතා කරන්න.";
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'si-LK'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            isProcessing = true;
            setBotState('listening');
            statusText.innerText = "මම ඔබට ඇහුම්කන් දෙනවා, සිංහලෙන් කතා කරන්න... 🎤";
        };

        recognition.onerror = (e) => {
            isProcessing = false;
            setBotState('');
            statusText.innerText = "හඬ හඳුනා ගැනීමට නොහැකි වුණා. නැවත උත්සාහ කරන්න.";
        };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            setBotState('thinking');
            statusText.innerHTML = `<b>ඔබ:</b> ${userText}<br><br>Verity සිතමින් පවතී... 🧠`;

            // තත්පර 1ක ප්‍රමාදයකින් පසු ස්ථාවරව පිළිතුරු දීම
            setTimeout(() => {
                generateLocalResponse(userText);
            }, 1000);
        };

        recognition.start();
    }

    function generateLocalResponse(text) {
        const statusText = document.getElementById('statusText');
        let aiText = "ඔබ පැවසූ දේ මට හොඳින්ම වැටහුණා. මම Verity Gaming AI සහකරු, ඔබට උදව් කිරීමට මම සැමවිටම සූදානම්!";

        // සරල සිංහල ප්‍රශ්න කිහිපයකට බුද්ධිමත් පිළිතුරු (Local NLP)
        const lowerText = text.toLowerCase();
        if (lowerText.includes("කවුද") || lowerText.includes("කවුද ඔයා")) {
            aiText = "මම Verity, ඔයාගේ හුරතල් කහ පාට බෝල රොබෝ AI සහකරු වෙනවා!";
        } else if (lowerText.includes("සැප") || lowerText.includes("කොහොමද")) {
            aiText = "මට ගොඩක් සතුටුයි සහ සුවපහසුයි! ඔයාට කොහොමද?";
        } else if (lowerText.includes("නම")) {
            aiText = "මගේ නම Verity AI. මාව නිර්මාණය කළේ ඔයාට උදව් කරන්නයි!";
        } else if (lowerText.includes("ස්තුතියි") || lowerText.includes("thank you")) {
            aiText = "ඔබටත් ස්තුතියි! තවත් උදව්වක් අවශ්‍ය නම් මට පවසන්න.";
        }

        statusText.innerHTML = `<b>ඔබ:</b> ${text}<br><br><b style="color:#ffcc00">Verity:</b> ${aiText}`;
        speakSinhala(aiText);
    }

    function speakSinhala(text) {
        if ('speechSynthesis' in window) {
            setBotState('speaking');
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'si-LK'; 
            utterance.rate = 1.0; 

            utterance.onend = () => {
                isProcessing = false;
                setBotState('');
            };

            window.speechSynthesis.speak(utterance);
        } else {
            isProcessing = false;
            setBotState('');
        }
    }
</script>

</body>
</html>
